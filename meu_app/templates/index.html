
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introdução ao Django</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <main>
        <h1>Minha primeira página com Django!</h1>
        <p>Disciplina: Projeto de Software</p>

        <h2>Meus livros favoritos</h2>
        <ol>
            {% for livro in livros %}
                <li>{{ livro.titulo }}</li>
            {% endfor %}
        </ol>

        <h2>Atividades que gosto de fazer</h2>
        <ul>
            {% for atividade in atividades %}
                <li>{{ atividade.titulo }}</li>
            {% endfor %}
        </ul>
    </main>
</body>
</html>
